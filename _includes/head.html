<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {%- if page.title -%}
      {{ page.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>

  {% seo title=false %}
  {% feed_meta %}

  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="{{ site.favicon | relative_url }}"
  />

  <link
    rel="stylesheet"
    href="{{ '/assets/css/main.css' | relative_url }}"
  />

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ['$', '$'],
          ['\\(', '\\)']
        ],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]']
        ],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: [
          'script',
          'noscript',
          'style',
          'textarea',
          'pre',
          'code'
        ]
      }
    };
  </script>

  <script
    defer
    id="MathJax-script"
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>

  {% if page.noindex %}
    <meta name="robots" content="noindex{% if page.nofollow %}, nofollow{% endif %}">
  {% endif %}

  <link
    id="favicon"
    rel="icon"
    type="coin/png"
    href="{{ '/favicon.png' | relative_url }}"
  >
  
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const favicon = document.getElementById("favicon");
    const faviconSrc = "{{ '/favicon.png' | relative_url }}";
  
    const image = new Image();
    image.src = faviconSrc;
  
    const canvas = document.createElement("canvas");
    const size = 64;
  
    canvas.width = size;
    canvas.height = size;
  
    const ctx = canvas.getContext("2d");
  
    let isAnimating = false;
  
    function animateFavicon() {
      if (isAnimating || !image.complete) {
        return;
      }
  
      isAnimating = true;
  
      const duration = 700;
      const startTime = performance.now();
  
      function drawFrame(currentTime) {
        const progress = Math.min(
          (currentTime - startTime) / duration,
          1
        );
  
        const angle = progress * Math.PI * 2;
  
        ctx.clearRect(0, 0, size, size);
  
        ctx.save();
        ctx.translate(size / 2, size / 2);
        ctx.rotate(angle);
  
        ctx.drawImage(
          image,
          -size / 2,
          -size / 2,
          size,
          size
        );
  
        ctx.restore();
  
        favicon.href = canvas.toDataURL("coin/png");
  
        if (progress < 1) {
          requestAnimationFrame(drawFrame);
        } else {
          favicon.href = faviconSrc;
          isAnimating = false;
        }
      }
  
      requestAnimationFrame(drawFrame);
    }
  
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        animateFavicon();
      }
    });
    
    image.addEventListener("load", () => {
      if (document.visibilityState === "visible") {
        animateFavicon();
      }
    });
  });
  </script>
</head>
